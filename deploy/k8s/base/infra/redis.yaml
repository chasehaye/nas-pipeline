apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: nas
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Ephemeral cache: no persistence at all. The live-flight map is
          # derived state (rebuilt from fixm.filtered within the TTL window), so
          # an empty restart is a non-event -- and nothing on disk means no AOF
          # corruption crash-loop. `--save ""` disables RDB, `--appendonly no`
          # disables AOF.
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: nas
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
