name: deploy-bridge (cloud build)

# Build the bridge (Java) image on the GitHub runner, then stream it straight
# into the k3s server's containerd and restart the Deployment.
#
# Why this exists: the k3s host's RAM corrupts images built locally (a clean
# build still comes out silently bit-flipped, which SIGILLs the JVM at startup;
# see docs/post-mortems). Stock pulled images run fine on the box, so building
# bridge on a clean runner and importing it sidesteps the corruption.
#
# Manual only: Actions -> "deploy-bridge (cloud build)" -> Run workflow.

on:
  workflow_dispatch:

# Share the deploy lock so this never runs at the same time as the main deploy.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-and-ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner is linux/amd64, matching the k3s host, so a plain build is
      # the right architecture.
      - name: Build bridge image on the runner
        run: docker build -t nas-bridge:latest ./bridge

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Import into k3s and roll out
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host $SERVER_HOST
              User $SERVER_USER
              IdentityFile ~/.ssh/deploy_key
              ProxyCommand cloudflared access ssh --hostname %h
              StrictHostKeyChecking no
          EOF
          # Stream the freshly-built image straight into k3s containerd (the same
          # import path deploy.sh uses), then restart the Deployment so the new
          # nas-bridge:latest is picked up (imagePullPolicy is IfNotPresent).
          docker save nas-bridge:latest \
            | ssh "$SERVER_HOST" 'sudo k3s ctr images import -'
          ssh "$SERVER_HOST" 'sudo k3s kubectl rollout restart deploy/bridge -n nas'
