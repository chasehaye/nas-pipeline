apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: nas
  labels: { app: kafka-exporter }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka-exporter } }
  template:
    metadata:
      labels: { app: kafka-exporter }
    spec:
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:latest
          args: ["--kafka.server=kafka:29092"]
          ports:
            - containerPort: 9308

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: nas
spec:
  selector: { app: kafka-exporter }
  ports:
    - port: 9308
      targetPort: 9308
