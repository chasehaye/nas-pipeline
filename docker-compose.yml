services:

  # Kafka in KRaft mode: no ZooKeeper needed.
  kafka:
    image: apache/kafka:3.9.0
    container_name: nas-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760

      # Retention: how far back you can replay
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: nas-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        BS=kafka:29092
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BS \
            --create --if-not-exists --topic "$$1" \
            --partitions "$$2" --replication-factor 1 \
            --config retention.ms=172800000
        }
        create fixm.raw 1
        create fixm.normalized 1
        create fixm.normalized.dlq 1
        create fixm.filtered 1
        create fixm.filtered.dlq 1
        create cache-writer.dlq 1
        create database-writer.dlq 1
        echo "topics ready"

  redis:
    image: redis:7-alpine
    container_name: nas-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: nas-postgres
    ports:
      # Host 5433 -> container 5432: a native PostgreSQL already owns host 5432.
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-naspipeline}
      POSTGRES_USER: ${POSTGRES_USER:-naspipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Schema is applied by database-writer's embedded migrations on startup,
      # not here — so this needs no init mount.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naspipeline}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka UI. Not required
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nas-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: nas-pipeline
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  # Redis UI. Not required. Browse flight:* hashes, TTLs, memory.
  # On first load add a database with host "redis", port 6379.
  redis-insight:
    image: redis/redisinsight:latest
    container_name: nas-redis-insight
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - redisinsight-data:/data

  # Metrics store. Scrapes services' /metrics on an interval (pull model).
  # UI + query console at http://localhost:9090 (try: rate(normalizer_envelopes_processed_total[1m])).
  prometheus:
    image: prom/prometheus:latest
    container_name: nas-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Lets Prometheus reach host-run services (make services) at host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Exposes Kafka consumer-group lag as Prometheus metrics. The broker owns lag
  # (not the services), so this sidecar reads it and Prometheus scrapes it.
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: nas-kafka-exporter
    command: ["--kafka.server=kafka:29092"]
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy

  # Dashboards over Prometheus. http://localhost:3000 (anonymous admin in dev).
  grafana:
    image: grafana/grafana:latest
    container_name: nas-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # Postgres/TimescaleDB UI. Not required. Auto-connects to the history DB.
  # Browse flights + positions and run SQL at http://localhost:8081
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: nas-pgweb
    ports:
      - "8081:8081"
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-naspipeline}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-naspipeline}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kafka-data:
  redis-data:
  postgres-data:
  redisinsight-data:
  prometheus-data:
  grafana-data: