apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: nas
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nas-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: api-config
          env:
            # Postgres durable read path (embeds the password).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: postgres, key: DATABASE_URL }
          ports:
            - containerPort: 8090

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: nas
spec:
  selector:
    app: api
  ports:
    - port: 8090
      targetPort: 8090
