apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: nas
data:
  POSTGRES_DB: "naspipeline"
  POSTGRES_USER: "naspipeline"
  # Subdir so a drive's lost+found doesn't block initdb.
  PGDATA: "/var/lib/postgresql/data/pgdata"

---
# Size and storageClassName are set per overlay.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: nas
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: nas
  labels: { app: postgres }
spec:
  replicas: 1
  # Never run two pods against the one RWO volume.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      securityContext:
        # Alpine postgres runs as gid 70.
        fsGroup: 70
      containers:
        - name: postgres
          image: timescale/timescaledb:latest-pg16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef: { name: postgres-config }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres, key: POSTGRES_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "naspipeline", "-d", "naspipeline"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "naspipeline", "-d", "naspipeline"] }
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: nas
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
