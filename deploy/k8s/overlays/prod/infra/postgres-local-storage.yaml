# Postgres on its own drive (drive2), separate from kafka/redis.
# Server setup (one-time, on the storage node):
#   sudo mkdir -p /mnt/drive2/nas/postgres && sudo chown 70:70 /mnt/drive2/nas/postgres
#   sudo k3s kubectl label node <node> nas-storage=postgres
# The label (not the hostname) pins this PV, so the node name stays out of git.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: postgres-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
spec:
  capacity:
    storage: 1Ti
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain   # keep data if the PVC is deleted
  storageClassName: postgres-local
  local:
    path: /mnt/drive2/nas/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: nas-storage
              operator: In
              values:
                - postgres
