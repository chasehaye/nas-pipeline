apiVersion: v1
kind: ConfigMap
metadata:
  name: database-writer-config
  namespace: nas
data:
  KAFKA_BROKERS: "kafka:29092"
  KAFKA_TOPIC_FILTERED: "fixm.filtered"
  KAFKA_TOPIC_DB_DLQ: "database-writer.dlq"
  KAFKA_GROUP: "database-writer"
  OPS_ADDR: ":2112"
  DB_WRITER_BATCH_SIZE: "500"
  DB_WRITER_FLUSH_TIMEOUT: "1s"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-writer
  namespace: nas
  labels: { app: database-writer }
spec:
  replicas: 1
  selector: { matchLabels: { app: database-writer } }
  template:
    metadata:
      labels: { app: database-writer }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2112"
    spec:
      containers:
        - name: database-writer
          image: nas-database-writer:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: database-writer-config }
          env:
            # From the Secret (embeds the password).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: postgres, key: DATABASE_URL }
          ports:
            - containerPort: 2112
              name: ops
          livenessProbe:
            httpGet: { path: /healthz, port: 2112 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 2112 }
            initialDelaySeconds: 5
            periodSeconds: 10
