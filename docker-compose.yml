services:

  # Kafka in KRaft mode: no ZooKeeper needed.
  kafka:
    image: apache/kafka:3.9.0
    container_name: nas-kafka
    ports:
      # 9092 is for clients running on your host (the bridge, for now).
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Two listeners: INTERNAL for containers talking to each other by
      # service name, EXTERNAL for processes on your host via localhost.
      # Getting this wrong is the single most common Kafka-in-Docker problem.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single broker, so replication factor must be 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Your FIXM collections hit 370KB. Default max is 1MB, which would
      # be fine, but raise it so a burst of large batches can't fail sends.
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760

      # Retention: how far back you can replay. 7 days at your volume is
      # a lot of disk (~1TB uncompressed), so start at 2 and raise it once
      # you know what compression buys you.
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: nas-redis
    ports:
      - "6379:6379"
    # appendonly gives you durability across restarts. Current aircraft
    # state is rebuildable from Kafka, but not losing it on every
    # docker compose down is convenient.
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: nas-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-naspipeline}
      POSTGRES_USER: ${POSTGRES_USER:-naspipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naspipeline}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka UI. Not required, but being able to see topics, partitions, and
  # actual message contents in a browser saves a lot of CLI fumbling early on.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nas-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: nas-pipeline
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data:
  redis-data:
  postgres-data: