apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: nas

---
# Cluster-wide read of pods for service discovery (scoped by namespace in the
# scrape config).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-nas
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-nas
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-nas
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: nas

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: nas
  labels: { app: prometheus }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {} # ephemeral TSDB; swap for a PVC to retain history

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: nas
spec:
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
