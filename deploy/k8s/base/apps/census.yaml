apiVersion: v1
kind: ConfigMap
metadata:
  name: census-config
  namespace: nas
data:
  KAFKA_BROKERS: "kafka:29092"
  KAFKA_TOPIC_RAW: "fixm.raw"
  KAFKA_GROUP: "census"
  CENSUS_HTTP_ADDR: ":8088"
  CENSUS_SNAPSHOT: "/data/census.json"
  OPS_ADDR: ":2112"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: census
  namespace: nas
  labels: { app: census }
spec:
  replicas: 1
  selector: { matchLabels: { app: census } }
  template:
    metadata:
      labels: { app: census }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2112"
    spec:
      containers:
        - name: census
          image: nas-census:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: census-config }
          ports:
            - containerPort: 8088
              name: web
            - containerPort: 2112
              name: ops
          livenessProbe:
            httpGet: { path: /healthz, port: 2112 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 2112 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: snapshot
              mountPath: /data # the JSON shape snapshot lives at /data/census.json
      volumes:
        # Ephemeral: the shape rebuilds from the feed on restart. Swap for a PVC
        # if long-term schema accumulation across restarts matters.
        - name: snapshot
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: census
  namespace: nas
spec:
  selector:
    app: census
  ports:
    - port: 8088
      targetPort: 8088
